# StoryForge 配置文件示例
#
# 使用方法：
#   1. 复制本文件为 storyforge.yaml（同目录）
#      cp .storyforge/storyforge.example.yaml .storyforge/storyforge.yaml
#   2. 修改下面的字段为你的实际配置
#   3. 重启服务：./deploy.sh restart
#
# 注意：storyforge.yaml 已加入 .gitignore，不会被提交（避免泄漏 API Key）。

# ==================== 大模型配置 ====================
llm:
  # provider 可选: mock | openai | anthropic
  #   mock:      内置占位响应（不调用任何 API，用于本地测试）
  #   openai:    OpenAI 或 OpenAI 兼容协议（如 DeepSeek / OpenRouter / 本地 vllm）
  #   anthropic: Anthropic Claude
  provider: mock

  # 模型名称
  model: gpt-4o-mini

  # API Key（若 provider 为 mock 可留空）
  api_key: ""

  # 自定义 endpoint（可选，留空使用官方默认）
  # 例如 OpenRouter: https://openrouter.ai/api/v1
  # 例如本地 vllm:    http://localhost:8000/v1
  base_url: ""

  # 默认采样温度（0.0-2.0）
  temperature: 0.7

  # 单次请求超时（秒）
  timeout: 60

  # 透传给底层 SDK 的额外参数（按需）
  extra:
    # max_tokens: 4096

# ==================== 存储配置 ====================
storage:
  # 小说数据目录
  #   - 相对路径：基于项目根目录解析
  #   - 绝对路径：直接使用
  data_dir: ./data

# ==================== 服务器配置 ====================
server:
  host: 0.0.0.0
  port: 5089
  cors_origins: "*"

# ==================== Pipeline 配置 ====================
pipeline:
  # 最大审稿轮次（超过强制进入校对）
  max_review_rounds: 3
  # 默认单章目标字数
  default_target_word_count: 3000
